[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "peppermint-lang"
version = "0.4.0a1"
description = "A pipe-first language for data and ML work, running on top of Python"
readme = "README.md"
license = "MIT"
authors = [{ name = "Chayapatr (Pub) Archiwaranguprok", email = "pub@mit.edu" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
data = ["pandas"]
ml = ["pandas", "scikit-learn", "umap-learn", "openai"]
viz = ["pandas", "matplotlib", "seaborn"]
lsp = ["pygls"]
all = [
    "pandas",
    "scikit-learn",
    "umap-learn",
    "openai",
    "matplotlib",
    "seaborn",
    "pygls",
]

[project.urls]
Repository = "https://github.com/chayapatr/peppermint"

[project.scripts]
pep = "peppermint.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["peppermint*"]
